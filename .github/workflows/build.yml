name: Desktop and Android builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: build:win
            artifact: OpenHarness-Windows
            paths: |
              release/*.exe
              release/*.yml
          - os: ubuntu-latest
            command: build:linux
            artifact: OpenHarness-Linux
            paths: |
              release/*.AppImage
              release/*.yml
          - os: ubuntu-latest
            command: build:android
            artifact: OpenHarness-Android
            paths: |
              android/app/build/outputs/apk/debug/*.apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Android needs a JDK 17 toolchain and the Android SDK (preinstalled on
      # ubuntu runners, activated through the setup helper).
      - if: matrix.artifact == 'OpenHarness-Android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: matrix.artifact == 'OpenHarness-Android'
        uses: android-actions/setup-android@v3
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenHarness ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.apk
            artifacts/*.yml
